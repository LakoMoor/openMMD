name: Build downloadable applications
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test --locked
      - run: cargo build --locked --release --bin openmmd
      - name: Package executable and notices
        shell: bash
        run: python scripts/package_native.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openmmd-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: openmmd-*
          path: dist
          merge-multiple: true
      - name: Publish preview binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "openMMD $GITHUB_REF_NAME" --notes-file docs/release-notes.md
